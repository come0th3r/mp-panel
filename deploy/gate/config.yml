# Seed copied into writable gate-config volume once. Gate API persists updates there.
config:
  bind: 0.0.0.0:25565
  lite:
    enabled: true
    routes:
      # v0.74.27 requires at least one route. .invalid never points to a game server.
      - host: mp-disabled.invalid
        backend: 127.0.0.1:1
  connectionTimeout: 5s
  readTimeout: 30s
api:
  enabled: true
  bind: 0.0.0.0:8080
